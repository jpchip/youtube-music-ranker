services:
  app:
    build: .
    expose:
      - "3001"
    volumes:
      - ranker-data:/app/server/data
    env_file:
      - server/.env
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  ranker-data:
  caddy-data:
  caddy-config:
